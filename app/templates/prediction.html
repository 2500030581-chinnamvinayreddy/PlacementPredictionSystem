{% extends "base.html" %}

{% block content %}

<div class="section">

    <h2>Placement Prediction</h2>

    <p>
        Enter the student's information to predict the
        placement status.
    </p>

</div>


<div class="section">

<form method="POST">

    <div class="form-group">

        <label>
            CGPA
        </label>

        <input
            type="number"
            name="CGPA"
            step="0.01"
            min="0"
            max="10"
            required
        >

    </div>


    <div class="form-group">

        <label>
            Aptitude Test Score
        </label>

        <input
            type="number"
            name="AptitudeTestScore"
            min="0"
            max="100"
            required
        >

    </div>


    <div class="form-group">

        <label>
            Gender
        </label>

        <select name="Gender">

            <option>Male</option>
            <option>Female</option>

        </select>

    </div>


    <div class="form-group">

        <label>
            College Tier
        </label>

        <select name="CollegeTier">

            <option value="1">
                Tier 1
            </option>

            <option value="2">
                Tier 2
            </option>

            <option value="3">
                Tier 3
            </option>

        </select>

    </div>


    <div class="form-group">

        <label>
            History Of Backlogs
        </label>

        <select name="HistoryOfBacklogs">

            <option>Yes</option>
            <option>No</option>

        </select>

    </div>


    <button type="submit">
        Predict Placement
    </button>

</form>


{% if prediction %}

<div class="section">

    <h2>Prediction Result</h2>

    <p>
        {{ prediction }}
    </p>

</div>

{% endif %}

</div>

{% endblock %}
